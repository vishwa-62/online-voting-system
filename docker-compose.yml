version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=production_super_secret_jwt_key_2026
      - DB_ENGINE=sqlite
    volumes:
      - sqlite_data:/app/database

volumes:
  sqlite_data:
